<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>Click Sign to Move Camera</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>html,body{height:100%;margin:0} canvas{display:block}</style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
  // === Scene, Camera, Renderer ===
  const scene = new THREE.Scene();
  const bgTexture = new THREE.TextureLoader().load('https://checkki.github.io/381/final%20Project_381/Home.jpg');
  scene.background = bgTexture;

  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0, 1.2, 3);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;

  // --- เก็บตำแหน่งเริ่มต้นกล้อง ---
  const defaultCamPos = camera.position.clone();
  const defaultTarget = controls.target.clone();
  let isAboutVisible = false;

  // === Lights ===
  const hemi = new THREE.HemisphereLight(0xffffff, 0x333333, 0.6);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(3, 5, 2);
  dir.castShadow = true;
  scene.add(dir);

  // === Ground ===
  const ground = new THREE.Mesh(
    new THREE.PlaneBufferGeometry(10, 10),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0.0 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // === About group (ซ่อนไว้ก่อน) ===
  const aboutGroup = new THREE.Group();
  aboutGroup.name = 'AboutGroup';
  aboutGroup.visible = false;
  aboutGroup.position.set(-6.5, 1.0, -6.5);
  scene.add(aboutGroup);

  // helpers: เซ็ต/เฟดความทึบ
  function setOpacity(obj, opacity) {
    obj.traverse(ch => {
      if (ch.isMesh && ch.material) {
        if (ch.material.uniforms && ch.material.uniforms.uOpacity) {
            ch.material.uniforms.uOpacity.value = opacity;
        } else {
            ch.material.transparent = true;
            ch.material.opacity = opacity;
            ch.material.needsUpdate = true;
        }
      }
    });
  }
  function fadeTo(obj, toOpacity = 1, ms = 600) {
    const from = (obj.userData._opacity ?? 0);
    const t0 = performance.now();
    function f(t) {
      const k = Math.min((t - t0) / ms, 1);
      const v = THREE.MathUtils.lerp(from, toOpacity, k);
      obj.userData._opacity = v;
      setOpacity(obj, v);
      if (k < 1) requestAnimationFrame(f);
    }
    requestAnimationFrame(f);
  }

  const mixers = [];
  const clock = new THREE.Clock();
  const clickable = [];

  // --- Variable to store Tiny Home model ---
  let tinyHomeModel;

  // === Tiny Home ===
  const gltfLoader = new THREE.GLTFLoader();
  gltfLoader.load("https://checkki.github.io/381/final%20Project_381/tiny_home.glb",(gltf) => {
    tinyHomeModel = gltf.scene;
    tinyHomeModel.position.set(-6, 0, -6.5);
    tinyHomeModel.scale.set(0.75, 0.75, 0.75);
    tinyHomeModel.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; }});
    scene.add(tinyHomeModel);
  });

  // === Dog (Standard Material - ตัวแรก) ===
  const gltfLoaderDog = new THREE.GLTFLoader(); 
  gltfLoaderDog.load("https://checkki.github.io/381/dog.glb",(gltf) => { 
    const dogModel = gltf.scene; 
    dogModel.name = 'Dog'; 
    dogModel.scale.set(0.3, 0.3, 0.3); 
    dogModel.position.set(1.5, 0, 3.5); 
    dogModel.traverse(node => { if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; } }); 
    scene.add(dogModel); 
    clickable.push(dogModel); 
    if (gltf.animations && gltf.animations.length) {
      const mixer = new THREE.AnimationMixer(dogModel);
      gltf.animations.forEach(clip => mixer.clipAction(clip).play());
      mixers.push(mixer);
    }
  });

   // === Character (Standard Material) ===
  const gltfLoadercheck = new THREE.GLTFLoader(); 
  gltfLoadercheck.load("https://checkki.github.io/381/final%20Project_381/lowpoly_anime_character_cyberstyle.glb",(gltf) => { 
    const dogModel = gltf.scene; 
    dogModel.name = 'Dog'; 
    dogModel.scale.set(0.9, 0.9, 0.9); 
    dogModel.position.set(-0.2, 0, 3.5); 
    dogModel.traverse(node => { if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; } }); 
    scene.add(dogModel); 
    clickable.push(dogModel); 
    if (gltf.animations && gltf.animations.length) {
      const mixer = new THREE.AnimationMixer(dogModel);
      gltf.animations.forEach(clip => mixer.clipAction(clip).play());
      mixers.push(mixer);
    }
  });

  // === Car (Standard Material) ===
  const car = new THREE.GLTFLoader();
  car.load("https://checkki.github.io/381/final%20Project_381/1994_toretto.glb",(gltf) => {
    const model = gltf.scene;
    model.position.set(4.2, 0, 3.0);
    model.scale.set(0.7, 0.7, 0.7);
    model.traverse(node => { if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; }});
    scene.add(model);
  });

  // === Street Lamp ===
  const streetLamp = new THREE.GLTFLoader();
  streetLamp.load("https://checkki.github.io/381/final%20Project_381/street_lamp_game_ready_prop.glb",(gltf) => {
    const model = gltf.scene;
    model.position.set(-6, 0, 4.5);
    model.scale.set(0.5, 0.5, 0.5);
    model.traverse(node => { if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; }});
    scene.add(model);
  });
  
  
  // === White Flower Vertex Displacement Shader ===
  
  const whiteFlowerUniforms = { 
    uTime: { value: 0.0 }
  };
  
  const whiteFlowerVert = `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vColor;
    
    void main() {
        vNormal = normalize(normalMatrix * normal);
        
        vec3 newPosition = position;
        
        // --- Displacement Effect (Waving/Breathing effect, stronger at the top) ---
        float heightFactor = max(0.0, position.y * 2.0); 
        float waveSpeed = 2.0;
        float waveStrength = 0.05 * heightFactor;
        
        float displacementX = sin(position.y * 3.0 + uTime * waveSpeed) * waveStrength;
        float displacementZ = cos(position.y * 4.0 + uTime * waveSpeed * 1.5) * waveStrength;
        
        newPosition.x += displacementX;
        newPosition.z += displacementZ;
        
        vColor = normal * 0.5 + 0.5;
        
        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
  `;

  const whiteFlowerFrag = `
    precision mediump float;
    varying vec3 vNormal;
    varying vec3 vColor;

    void main() {
        vec3 normal = normalize(vNormal);
        vec3 lightDir = normalize(vec3(3.0, 5.0, 2.0)); 

        float diff = max(dot(normal, lightDir), 0.0);
        vec3 ambient = vec3(0.5); 
        
        vec3 baseColor = vec3(1.0); 
        vec3 finalColor = baseColor * (ambient + diff * 0.5); 

        gl_FragColor = vec4(finalColor, 1.0);
    }
  `;

  const whiteFlowerMaterial = new THREE.ShaderMaterial({
      vertexShader: whiteFlowerVert,
      fragmentShader: whiteFlowerFrag,
      uniforms: whiteFlowerUniforms,
      flatShading: false 
  });
  
  // === white_flower Loader ===
  const gltfLoaderFlower = new THREE.GLTFLoader();
  let whiteFlowerModel;
  gltfLoaderFlower.load("https://checkki.github.io/381/final%20Project_381/white_flower.glb",(gltf) => {
    whiteFlowerModel = gltf.scene;
    whiteFlowerModel.name = 'WhiteFlower';
    whiteFlowerModel.position.set(-4.3, 0, 4.2); 
    whiteFlowerModel.scale.set(0.02, 0.02, 0.02);
    
    whiteFlowerModel.traverse(node => { 
        if (node.isMesh) { 
            node.material = whiteFlowerMaterial; 
            node.castShadow = true; 
            node.receiveShadow = true; 
        }
    });
    
    scene.add(whiteFlowerModel);
  });
  

  // === Flowerpot Vertex Displacement Shader (เดิม) ===
  const flowerpotUniforms = { 
    uTime: { value: 0.0 }
  };
  
  const flowerpotVert = `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vColor;

    void main() {
        vNormal = normalize(normalMatrix * normal);
        
        vec3 newPosition = position;
        
        float displacement = sin(position.y * 5.0 + uTime * 3.0) * 0.03; 
        newPosition += normal * displacement;
        
        vColor = vec3(0.5 + 0.5 * sin(position.y), 0.5 + 0.5 * cos(position.x), 0.8);
        
        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
  `;

  const flowerpotFrag = `
    precision mediump float;
    varying vec3 vNormal;
    varying vec3 vColor;

    void main() {
        vec3 normal = normalize(vNormal);
        vec3 lightDir = normalize(vec3(3.0, 5.0, 2.0)); 

        float diff = max(dot(normal, lightDir), 0.0);
        vec3 ambient = vec3(0.3);
        
        vec3 finalColor = vColor * (ambient + diff * 0.7); 

        gl_FragColor = vec4(finalColor, 1.0);
    }
  `;

  const flowerpotMaterial = new THREE.ShaderMaterial({
      vertexShader: flowerpotVert,
      fragmentShader: flowerpotFrag,
      uniforms: flowerpotUniforms,
      flatShading: true 
  });
  
  // === Flowerpot Loader ===
  const gltfLoaderFlowerpot = new THREE.GLTFLoader();
  let flowerpotModel;
  gltfLoaderFlowerpot.load("https://checkki.github.io/381/final%20Project_381/rose_flower.glb",(gltf) => {
    flowerpotModel = gltf.scene;
    flowerpotModel.name = 'Flowerpot';
    flowerpotModel.scale.set(0.4, 0.4, 0.4);
    flowerpotModel.position.set(2.5, 0.7, 3.5);
    
    flowerpotModel.traverse(node => { 
        if (node.isMesh) { 
            node.material = flowerpotMaterial; 
            node.castShadow = true; 
            node.receiveShadow = true; 
        }
    });
    
    scene.add(flowerpotModel);
    clickable.push(flowerpotModel);
    if (gltf.animations && gltf.animations.length) {
      const mixer = new THREE.AnimationMixer(flowerpotModel);
      gltf.animations.forEach(clip => mixer.clipAction(clip).play());
      mixers.push(mixer);
    }
  });

  // === Dog Puppy Cell/Toon Shader (พร้อม Vertex Displacement) ===
  const puppyUniforms = {
    uLightDir: { value: dir.position.clone().normalize() }, 
    uBaseColor: { value: new THREE.Color(0xAAAAAA) },
    uTime: { value: 0.0 } 
  };

  const puppyVert = `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vPosW;
    
    void main(){
      vNormal = normalize(mat3(modelMatrix) * normal);
      vPosW   = ( modelMatrix * vec4(position, 1.0)).xyz;
      
      // *** เพิ่ม Vertex Displacement: Dog Puppy จะสั่น/เต้นเล็กน้อย ***
      vec3 newPosition = position;
      // ใช้ Normal เพื่อให้บิดเบือนไปตามทิศทางพื้นผิว (เหมือนการสั่น)
      float wave = sin(position.x * 20.0 + uTime * 5.0) * cos(position.z * 10.0) * 0.005;
      newPosition += normal * wave; 
      
      gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
  `;

  const puppyFrag = `
    precision mediump float;
    varying vec3 vNormal;
    varying vec3 vPosW;
    uniform vec3 uLightDir;
    uniform vec3 uBaseColor;
    
    float shade(float diff) {
        float levels = 4.0; 
        return floor(diff * levels) / levels;
    }

    void main()
    {
      vec3 normal = normalize(vNormal);
      float diffuse = clamp(dot(normal, uLightDir), 0.0, 1.0);
      diffuse = shade(diffuse);
      
      vec3 R = reflect(-uLightDir, normal);
      vec3 V = normalize(cameraPosition - vPosW);
      float specular = pow( max( dot(R,V), 0.0 ) , 64.0);
      specular = step(0.9, specular) * 0.5;

      vec3 ambient = vec3(0.2);
      vec3 color = (uBaseColor * (ambient + diffuse * 0.8)) + vec3(specular);

      gl_FragColor = vec4(color, 1.0);
    }
  `;

  const puppyMaterial = new THREE.ShaderMaterial({
    vertexShader: puppyVert,
    fragmentShader: puppyFrag,
    uniforms: puppyUniforms,
    
  });
  
  // === Dog Puppy Loader (ใช้ Cell Shader) ===
  const gltfLoaderdog_puppy = new THREE.GLTFLoader(); 
  gltfLoaderdog_puppy.load("https://checkki.github.io/381/dog_puppy.glb",(gltf) => { 
    const dogModel = gltf.scene; 
    dogModel.name = 'dog_puppy'; 
    dogModel.scale.set(1.5, 1.5, 1.5); 
    dogModel.position.set(-2, 0, 3.7); 
    
    dogModel.traverse(node => { 
        if (node.isMesh) { 
            node.material = puppyMaterial; 
            node.castShadow = true; 
            node.receiveShadow = true; 
        }
    });
  
    scene.add(dogModel); 
    clickable.push(dogModel); 
    if (gltf.animations && gltf.animations.length) {
      const mixer = new THREE.AnimationMixer(dogModel);
      gltf.animations.forEach(clip => mixer.clipAction(clip).play());
      mixers.push(mixer);
    }
  });

  // === Picture in About ===
  const textureLoader = new THREE.TextureLoader();
  const myTexture = textureLoader.load('https://checkki.github.io/381/final%20Project_381/check_.jpg');
  const myPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(1.6, 1.6),
    new THREE.MeshBasicMaterial({ map: myTexture, transparent: true })
  );
  myPlane.name = 'Picture';
  myPlane.scale.set(2.5, 2.5, 2.5);
  myPlane.position.set(-6, 2.4, 0);
  myPlane.rotation.y = Math.PI * 0.02;
  aboutGroup.add(myPlane);

  // === Name Object in About ===
  const objLoader = new THREE.GLTFLoader();
  objLoader.load("https://checkki.github.io/381/final%20Project_381/name_chk.glb",(gltf) => {
    const nameObj = gltf.scene;
    nameObj.name = 'Name';
    nameObj.scale.set(0.20, 0.20, 0.20);
    nameObj.position.set(-4, 0.15, 0);
    nameObj.traverse((child) => {
      if (child.isMesh) {
        child.material = new THREE.MeshStandardMaterial({
          color: 0xFF99FF,
          metalness: 0.5,
          roughness: 0.4,
          transparent: true,
          opacity: 1
        });
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    aboutGroup.add(nameObj);
  });

  // === Sign (About Me) ===
  const signLoader = new THREE.GLTFLoader();
  let signModel;
  signLoader.load("https://checkki.github.io/381/final%20Project_381/a.glb",(gltf) => {
    signModel = gltf.scene;
    signModel.name = "Sign";
    signModel.position.set(-4, 0, 4.5);
    signModel.scale.set(0.8, 0.8, 0.8);
    signModel.traverse(node => { if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; }});
    scene.add(signModel);
    clickable.push(signModel);
  });

  // === Raycaster ===
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  window.addEventListener('pointerdown', (event) => {
    pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObjects(clickable, true);

    if (intersects.length > 0) {
      let root = intersects[0].object;
      while (root.parent && root.parent.type !== 'Scene') root = root.parent;

      if (root.name === "Sign") {
        if (!isAboutVisible) {
          aboutGroup.visible = true;
          aboutGroup.userData._opacity = 0;
          setOpacity(aboutGroup, 0);
          fadeTo(aboutGroup, 1, 650);
          frameObject(aboutGroup, 1.3, 60);
          isAboutVisible = true;
        } else {
          fadeTo(aboutGroup, 0, 400);
          setTimeout(() => { aboutGroup.visible = false; }, 450);
          frameHomeView();
          isAboutVisible = false;
        }
      }
    } else if (isAboutVisible) {
      fadeTo(aboutGroup, 0, 400);
      setTimeout(() => { aboutGroup.visible = false; }, 450);
      frameHomeView();
      isAboutVisible = false;
    }
  });

  // === Functions to frame objects/camera ===
  function frameObject(object3D, padding = 1.25, frames = 60) {
    const box = new THREE.Box3().setFromObject(object3D);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxSize = Math.max(size.x, size.y, size.z);
    const halfFovY = THREE.Math.degToRad(camera.fov / 2);
    const distance = (maxSize * padding) / (2 * Math.tan(halfFovY));
    const dir = new THREE.Vector3(0, 0.35, 1).normalize();
    const endPos = center.clone().add(dir.multiplyScalar(distance));
    const endTarget = center;
    const startPos = camera.position.clone();
    const startTarget = controls.target.clone();
    let p = 0;
    function animate() {
      p = Math.min(p + 1 / frames, 1);
      camera.position.lerpVectors(startPos, endPos, p);
      controls.target.lerpVectors(startTarget, endTarget, p);
      controls.update();
      if (p < 1) requestAnimationFrame(animate);
    }
    animate();
  }

  function frameHomeView(frames = 60) {
    if (tinyHomeModel) {
      frameObject(tinyHomeModel, 1.8, frames);
    } else {
      moveCameraBack(frames);
    }
  }

  function moveCameraBack(frames = 60) {
    const startPos = camera.position.clone();
    const startTarget = controls.target.clone();
    let p = 0;
    function animate() {
      p = Math.min(p + 1 / frames, 1);
      camera.position.lerpVectors(startPos, defaultCamPos, p);
      controls.target.lerpVectors(startTarget, defaultTarget, p);
      controls.update();
      if (p < 1) requestAnimationFrame(animate);
    }
    animate();
  }

  // === Resize ===
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // === Animation Loop ===
  let t = 0;
  (function loop(){
    const delta = clock.getDelta();
    mixers.forEach(mixer => mixer.update(delta));
    t += 0.01;
    dir.position.x = 3 + Math.sin(t) * 1.0;
  
    if (flowerpotUniforms) {
        flowerpotUniforms.uTime.value += 0.05;
    }
    if (whiteFlowerUniforms) {
        whiteFlowerUniforms.uTime.value += 0.05;
    }
    if (puppyUniforms.uTime) {
        puppyUniforms.uTime.value += 0.05; 
    }
    
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();

</script>
</body>
</html>
